<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übergabe-Generator</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #5d6677;
    --line: #d6dae2; --accent: #1f5fbf; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --card: #1d222b; --text: #e7eaf0; --muted: #9aa4b5;
      --line: #343b48; --accent: #5b9bf0; --accent-text: #0b1220;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; margin-bottom: 14px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .row > label { flex: 1 1 180px; }
  label { display: block; font-weight: 600; font-size: .85rem; color: var(--muted); }
  input, select, textarea {
    width: 100%; margin-top: 4px; padding: 8px 10px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: inherit;
  }
  textarea { min-height: 200px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { color: var(--muted); font-size: .9rem; }
  #msg.err { color: #c0392b; }
  /* Kolory statusów: czerwony = opóźniony, żółty = problem, niebieski = w trasie, zielony = zrealizowany */
  :root {
    --delayed-bg: #fde8e8; --delayed-fg: #9b1c1c; --delayed-bd: #e02424;
    --problem-bg: #fef3c7; --problem-fg: #92400e; --problem-bd: #d97706;
    --moving-bg:  #e1effe; --moving-fg:  #1e429f; --moving-bd:  #3f83f8;
    --done-bg:    #def7ec; --done-fg:    #03543f; --done-bd:    #0e9f6e;
    --check-bg:   #eceff3; --check-fg:   #374151; --check-bd:   #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --delayed-bg: #3b1d1d; --delayed-fg: #fca5a5; --delayed-bd: #f87171;
      --problem-bg: #3a2f10; --problem-fg: #fcd34d; --problem-bd: #fbbf24;
      --moving-bg:  #172a4a; --moving-fg:  #93c5fd; --moving-bd:  #60a5fa;
      --done-bg:    #12342a; --done-fg:    #6ee7b7; --done-bd:    #34d399;
      --check-bg:   #2a303b; --check-fg:   #cbd5e1; --check-bd:   #6b7280;
    }
  }
  .t-delayed { --bg: var(--delayed-bg); --fg: var(--delayed-fg); --bd: var(--delayed-bd); }
  .t-problem { --bg: var(--problem-bg); --fg: var(--problem-fg); --bd: var(--problem-bd); }
  .t-moving  { --bg: var(--moving-bg);  --fg: var(--moving-fg);  --bd: var(--moving-bd); }
  .t-done    { --bg: var(--done-bg);    --fg: var(--done-fg);    --bd: var(--done-bd); }
  .t-check   { --bg: var(--check-bg);   --fg: var(--check-fg);   --bd: var(--check-bd); }

  .report h2 { font-size: 1.2rem; margin: 0 0 2px; }
  .report h3 { font-size: 1rem; margin: 18px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  .report .meta { color: var(--muted); margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 6px; }
  .chip {
    padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: .85rem;
    background: var(--bg); color: var(--fg); border: 1px solid var(--bd);
  }
  .hint { color: var(--muted); font-size: .85rem; margin: 2px 0 0; }
  .group { margin-top: 14px; }
  .group h4 {
    margin: 0 0 6px; padding: 4px 10px; font-size: .9rem; border-radius: 6px;
    background: var(--bg); color: var(--fg); border-left: 5px solid var(--bd);
  }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { text-align: left; padding: 6px 10px; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; }
  .group tbody tr { background: var(--bg); color: var(--fg); }
  .badge {
    display: inline-block; padding: 1px 9px; border-radius: 999px; font-weight: 600;
    border: 1px solid var(--bd); background: var(--card); color: var(--fg);
  }
  .notes { white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Übergabe-Generator</h1>
  <p class="sub">Wklej notatki i listę zleceń, kliknij „Generuj”. Dane zostają w tej przeglądarce.</p>

  <section class="card">
    <div class="row">
      <label>Datum <input type="date" id="date"></label>
      <label>Schicht
        <select id="shift">
          <option>Frühschicht</option>
          <option>Spätschicht</option>
          <option>Nachtschicht</option>
        </select>
      </label>
      <label>Disponent <input type="text" id="who" placeholder="Name"></label>
    </div>
  </section>

  <section class="cols">
    <div class="card">
      <label for="orders">Zlecenia (kopia z Excela, pierwszy wiersz = nagłówki)</label>
      <textarea id="orders" spellcheck="false"></textarea>
    </div>
    <div class="card">
      <label for="notes">Notatki (dowolny tekst)</label>
      <textarea id="notes" spellcheck="false"></textarea>
    </div>
  </section>

  <section class="card actions">
    <button class="primary" id="gen">Generuj</button>
    <button id="sample">Wczytaj przykład</button>
    <button id="clear">Wyczyść pola</button>
    <span id="msg"></span>
  </section>

  <section class="card">
    <div class="actions" style="margin-bottom:10px">
      <strong>Raport</strong>
      <button id="copy" disabled>Kopiuj raport</button>
    </div>
    <div id="report" class="report">Tu pojawi się raport.</div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var SAMPLE_ORDERS = [
    "LKW\tKennzeichen\tAuftrag\tKunde\tRoute\tPlan\tETA\tStatus",
    "LKW 01\tBS-TK 1201\tA-24811\tVolkswagen Logistik\tWolfsburg - Poznań\t08:00\t08:00\tErledigt",
    "LKW 02\tBS-TK 1202\tA-24812\tBosch Hildesheim\tHildesheim - Lyon\t10:30\t14:10\tVerspätet",
    "LKW 03\tWF-LM 330\tA-24815\tSalzgitter AG\tSalzgitter - Gdańsk\t12:00\t12:00\tUnterwegs",
    "LKW 04\tHE-DK 77\tA-24819\tMetro Cash&Carry\tHelmstedt - Praha\t13:45\t15:20\tVerspätet",
    "LKW 05\tBS-TK 1205\tA-24823\tContinental\tHannover - Gliwice\t15:00\t15:00\tBeladen",
    "LKW 06\tWF-LM 332\tA-24826\tSiemens Energy\tBraunschweig - Rotterdam\t16:30\t16:30\tUnterwegs",
    "LKW 07\tHE-DK 79\tA-24830\tAldi Süd\tMagdeburg - Wrocław\t18:00\t\tPanne",
    "LKW 08\tBS-TK 1208\tA-24833\tKNAUF\tPeine - Łódź\t19:15\t19:15\tEntladen"
  ].join("\n");

  var SAMPLE_NOTES = [
    "zmiana pn nocna, ogólnie spokojnie ale kilka rzeczy do dokończenia",
    "",
    "LKW 02 stoi w korku na A7 przed Lyonem?? kierowca mówi że ok 2h, klient Bosch uprzedzony (dzwoniłem ok 11) - Frau Becker chce potwierdzenie nowej godziny rozładunku bis 16 Uhr",
    "",
    "LKW 04 Verspätung wegen Zoll Grenze CZ, Herr Novák von Metro wartet, muss noch Slot bestätigen - Kowalski zadzwoni do spedycji do 17:00",
    "",
    "LKW 07 PANNE!! Reifen hinten links, Werkstatt kommt, kierowca Piotr czeka od 17:40. trzeba ustalić czy podstawić zastępczy - decyzja Schmidt, jutro rano najpóźniej 6:00",
    "",
    "faktura dla Salzgitter AG jeszcze nie wysłana (Anna z księgowości, do piątku)",
    "",
    "brak CMR przy A-24815?? sprawdzić z kierowcą LKW 03 jak dojedzie",
    "",
    "Müller prosił o raport tankowania z zeszłego tygodnia, nie zrobione, chyba do środy",
    "",
    "LKW 05 beladen, wyjazd planowo 15:00, ok. nic do roboty",
    "parking na dziedzińcu - brama zepsuta, Hausmeister wie, ale nikt nie dał terminu"
  ].join("\n");

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    date: $("date"), shift: $("shift"), who: $("who"),
    orders: $("orders"), notes: $("notes"),
    gen: $("gen"), sample: $("sample"), clear: $("clear"),
    copy: $("copy"), report: $("report"), msg: $("msg")
  };

  var lastReport = "";

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function dateDE(iso) {
    var p = (iso || "").split("-");
    return p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : "—";
  }

  function say(text, isErr) {
    el.msg.textContent = text || "";
    el.msg.className = isErr ? "err" : "";
  }

  // Wykrywa separator: tabulator (Excel) > średnik > pionowa kreska.
  function detectDelimiter(headerLine) {
    if (headerLine.indexOf("\t") !== -1) return "\t";
    if (headerLine.indexOf(";") !== -1) return ";";
    if (headerLine.indexOf("|") !== -1) return "|";
    return null;
  }

  // Zwraca { header: [...], rows: [[...], ...] } albo { error: "..." }
  function parseOrders(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim() !== ""; });
    if (lines.length === 0) return { header: [], rows: [] };
    var delim = detectDelimiter(lines[0]);
    if (!delim) return { error: "Nie rozpoznano separatora w pierwszym wierszu zleceń (oczekiwany tabulator, ; lub |)." };
    var split = function (l) { return l.split(delim).map(function (c) { return c.trim(); }); };
    var header = split(lines[0]);
    var rows = lines.slice(1).map(function (l) {
      var cells = split(l);
      while (cells.length < header.length) cells.push("");
      return cells;
    });
    return { header: header, rows: rows };
  }

  function formatTable(header, rows) {
    var widths = header.map(function (h, i) {
      var w = h.length;
      rows.forEach(function (r) { w = Math.max(w, (r[i] || "").length); });
      return w;
    });
    var line = function (cells) {
      return cells.map(function (c, i) { return (c || "").padEnd(widths[i]); }).join("  ").replace(/\s+$/, "");
    };
    var sep = widths.map(function (w) { return "-".repeat(w); }).join("  ");
    return [line(header), sep].concat(rows.map(line)).join("\n");
  }

  // ---- Etap 2: statusy i opóźnienia ----------------------------------------
  var DELAY_LIMIT = 15; // minuty; od tej wartości pojazd liczy się jako verspätet

  var COLUMN_ALIASES = {
    lkw: ["lkw", "fahrzeug", "pojazd", "truck"],
    kennzeichen: ["kennzeichen", "rejestracja", "nr rej"],
    auftrag: ["auftrag", "zlecenie"],
    kunde: ["kunde", "klient"],
    route: ["route", "trasa"],
    plan: ["plan", "soll", "planowo"],
    eta: ["eta", "ist", "prognoza"],
    status: ["status"]
  };
  var FIELD_ORDER = ["lkw", "kennzeichen", "auftrag", "kunde", "route", "plan", "eta", "delay", "status"];
  var FIELD_LABEL = {
    lkw: "LKW", kennzeichen: "Kennzeichen", auftrag: "Auftrag", kunde: "Kunde",
    route: "Route", plan: "Plan", eta: "ETA", delay: "Verspätung", status: "Status", hint: "Hinweis"
  };
  var GROUPS = [
    { id: "problem", title: "STÖRUNG / PROBLEM", short: "Störung" },
    { id: "delayed", title: "VERSPÄTET", short: "Verspätet" },
    { id: "moving",  title: "UNTERWEGS / IN BEARBEITUNG", short: "Unterwegs" },
    { id: "done",    title: "ERLEDIGT", short: "Erledigt" },
    { id: "check",   title: "ZU PRÜFEN", short: "Zu prüfen" }
  ];

  function mapColumns(header) {
    var map = {};
    header.forEach(function (h, i) {
      var key = h.toLowerCase().replace(/[^a-zäöüßąćęłńóśźż0-9 ]/g, "").trim();
      Object.keys(COLUMN_ALIASES).forEach(function (f) {
        if (map[f] === undefined && COLUMN_ALIASES[f].indexOf(key) !== -1) map[f] = i;
      });
    });
    return map;
  }

  // "8:05", "08:05", "8.05" -> minuty od północy; inaczej null
  function parseTime(s) {
    var m = /^(\d{1,2})[:.](\d{2})$/.exec((s || "").trim());
    if (!m) return null;
    var h = Number(m[1]), mi = Number(m[2]);
    return (h > 23 || mi > 59) ? null : h * 60 + mi;
  }

  // ETA przed planem o więcej niż 12 h = przejście przez północ
  function delayMinutes(plan, eta) {
    var d = eta - plan;
    return d < -720 ? d + 1440 : d;
  }

  function classifyStatus(s) {
    var t = (s || "").toLowerCase();
    if (/panne|störung|stoerung|unfall|schaden|awari|problem|wypadek/.test(t)) return "problem";
    if (/erledigt|zugestellt|abgeschlossen|geliefert|zrealizow|dostarczon/.test(t)) return "done";
    if (/verspät|verspaet|opóźn|opozn|stau|zoll/.test(t)) return "delayed";
    if (/unterwegs|laden|w trasie|załad|zalad|rozład|rozlad/.test(t)) return "moving";
    return null;
  }

  function fmtDelay(d, group) {
    if (d === null) return group === "delayed" ? "?" : "";
    if (d < 1) return "";
    if (d < 60) return "+" + d + " Min";
    return "+" + Math.floor(d / 60) + " h " + String(d % 60).padStart(2, "0") + " Min";
  }

  function classifyRow(cells, map) {
    var get = function (f) { return map[f] === undefined ? "" : (cells[map[f]] || ""); };
    var planRaw = get("plan"), etaRaw = get("eta");
    var plan = planRaw === "" ? null : parseTime(planRaw);
    var eta = etaRaw === "" ? null : parseTime(etaRaw);
    var cat = classifyStatus(get("status"));
    var reasons = [];
    if (planRaw !== "" && plan === null) reasons.push("Plan nicht lesbar: " + planRaw);
    if (etaRaw !== "" && eta === null) reasons.push("ETA nicht lesbar: " + etaRaw);
    if (cat === null) reasons.push("Status unbekannt: " + (get("status") || "leer"));
    var delay = (plan !== null && eta !== null) ? delayMinutes(plan, eta) : null;

    var group;
    if (reasons.length) group = "check";
    else if (cat === "problem") group = "problem";
    else if (cat === "done") group = "done";
    else if (cat === "delayed" || (delay !== null && delay >= DELAY_LIMIT)) group = "delayed";
    else group = "moving";

    var row = { group: group, delay: delay, hint: reasons.join("; ") };
    FIELD_ORDER.forEach(function (f) {
      row[f] = f === "delay" ? fmtDelay(delay, group) : get(f);
    });
    return row;
  }

  function buildStatusSection(parsed) {
    var n = parsed.rows.length;
    var title = "1. FAHRZEUGSTATUS (" + n + " Aufträge)";
    if (n === 0) return { text: title + "\n\nKeine Aufträge übergeben.", note: "", view: { title: title, empty: true } };

    var map = mapColumns(parsed.header);
    if (map.lkw === undefined || map.status === undefined) {
      return {
        text: title + "\n\n" + formatTable(parsed.header, parsed.rows),
        note: "Brak kolumny LKW lub Status w nagłówku. Pokazuję tabelę bez grupowania i bez opóźnień.",
        view: { title: title, flat: { header: parsed.header, rows: parsed.rows } }
      };
    }

    var rows = parsed.rows.map(function (r) { return classifyRow(r, map); });
    var note = "";
    if (map.plan === undefined || map.eta === undefined) {
      note = "Brak kolumny Plan lub ETA. Opóźnienia wyliczane tylko ze statusu.";
    }

    var counts = {};
    GROUPS.forEach(function (g) { counts[g.id] = 0; });
    rows.forEach(function (r) { counts[r.group]++; });
    var delays = rows.map(function (r) { return r.delay; }).filter(function (d) { return d !== null && d >= DELAY_LIMIT; });

    var view = { title: title, chips: [], maxDelay: "", limit: "(Verspätet ab " + DELAY_LIMIT + " Min. ETA nach Plan)", groups: [] };
    GROUPS.forEach(function (g) { view.chips.push({ id: g.id, text: g.short + " " + counts[g.id] }); });
    if (delays.length) view.maxDelay = "Größte Verspätung: " + fmtDelay(Math.max.apply(null, delays), "delayed");

    var out = [title, ""];
    out.push("Übersicht: " + GROUPS.map(function (g) { return g.short + " " + counts[g.id]; }).join("  |  "));
    if (view.maxDelay) out.push(view.maxDelay);
    out.push(view.limit);

    GROUPS.forEach(function (g) {
      var list = rows.filter(function (r) { return r.group === g.id; });
      if (!list.length) return;
      if (g.id === "delayed") {
        list.sort(function (a, b) { return (b.delay === null ? -1 : b.delay) - (a.delay === null ? -1 : a.delay); });
      }
      var fields = FIELD_ORDER.filter(function (f) {
        return f === "delay" ? g.id === "delayed" : map[f] !== undefined;
      });
      if (g.id === "check") fields.push("hint");
      var head = fields.map(function (f) { return FIELD_LABEL[f]; });
      var body = list.map(function (r) { return fields.map(function (f) { return r[f]; }); });
      view.groups.push({ id: g.id, title: g.title + " (" + list.length + ")", header: head, rows: body });
      out.push("");
      out.push(g.title + " (" + list.length + ")");
      out.push(formatTable(head, body));
    });
    return { text: out.join("\n"), note: note, view: view };
  }

  var lastNote = "";
  var lastView = null;

  // ---- Widok na ekranie (kolorowy HTML); do schowka idzie wersja tekstowa ----
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderTable(header, rows, badgeCol) {
    var wrap = h("div", "tablewrap");
    var table = h("table");
    var tr = h("tr");
    header.forEach(function (c) { tr.appendChild(h("th", "", c)); });
    table.appendChild(h("thead")).appendChild(tr);
    var tbody = h("tbody");
    rows.forEach(function (r) {
      var row = h("tr");
      r.forEach(function (c, i) {
        var td = h("td");
        if (i === badgeCol && c) td.appendChild(h("span", "badge", c));
        else td.textContent = c;
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function renderReport(v) {
    var root = el.report;
    root.textContent = "";
    root.appendChild(h("h2", "", "ÜBERGABEBERICHT DISPOSITION"));
    root.appendChild(h("p", "meta", v.meta));
    root.appendChild(h("h3", "", v.status.title));
    var s = v.status;
    if (s.empty) {
      root.appendChild(h("p", "", "Keine Aufträge übergeben."));
    } else if (s.flat) {
      root.appendChild(renderTable(s.flat.header, s.flat.rows, -1));
    } else {
      var chips = h("div", "chips");
      s.chips.forEach(function (c) { chips.appendChild(h("span", "chip t-" + c.id, c.text)); });
      root.appendChild(chips);
      if (s.maxDelay) root.appendChild(h("p", "hint", s.maxDelay));
      root.appendChild(h("p", "hint", s.limit));
      s.groups.forEach(function (g) {
        var sec = h("div", "group t-" + g.id);
        sec.appendChild(h("h4", "", g.title));
        sec.appendChild(renderTable(g.header, g.rows, g.header.indexOf("Status")));
        root.appendChild(sec);
      });
    }
    root.appendChild(h("h3", "", "2. NOTIZEN"));
    root.appendChild(h("p", "notes", v.notes));
  }

  function buildReport() {
    var parsed = parseOrders(el.orders.value);
    if (parsed.error) { say(parsed.error, true); return null; }

    var notes = el.notes.value.replace(/\s+$/, "");
    if (parsed.rows.length === 0 && notes === "") {
      say("Wklej zlecenia lub notatki.", true);
      return null;
    }

    var out = [];
    out.push("ÜBERGABEBERICHT DISPOSITION");
    var meta = "Datum: " + dateDE(el.date.value) + "  |  Schicht: " + el.shift.value +
               "  |  Disponent: " + (el.who.value.trim() || "—");
    out.push(meta);
    out.push("=".repeat(60));
    out.push("");
    var status = buildStatusSection(parsed);
    lastNote = status.note;
    lastView = { meta: meta, status: status.view, notes: notes !== "" ? notes : "Keine Notizen." };
    out.push(status.text);
    out.push("");
    out.push("2. NOTIZEN");
    out.push("");
    out.push(notes !== "" ? notes : "Keine Notizen.");
    out.push("");
    return out.join("\n");
  }

  function generate() {
    say("");
    var text = buildReport();
    if (text === null) return;
    lastReport = text;
    renderReport(lastView);
    el.copy.disabled = false;
    say(lastNote ? "Raport gotowy. " + lastNote : "Raport gotowy.");
  }

  function copyReport() {
    if (!lastReport) return;
    var done = function () { say("Skopiowano do schowka."); };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = lastReport;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); }
      catch (e) { say("Nie udało się skopiować. Zaznacz tekst ręcznie.", true); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastReport).then(done, fallback);
    } else {
      fallback();
    }
  }

  el.date.value = todayISO();
  el.gen.addEventListener("click", generate);
  el.copy.addEventListener("click", copyReport);
  el.sample.addEventListener("click", function () {
    el.orders.value = SAMPLE_ORDERS;
    el.notes.value = SAMPLE_NOTES;
    say("Wczytano dane przykładowe (fikcyjne).");
  });
  el.clear.addEventListener("click", function () {
    el.orders.value = "";
    el.notes.value = "";
    el.report.textContent = "Tu pojawi się raport.";
    lastReport = "";
    el.copy.disabled = true;
    say("");
  });
})();
</script>
</body>
</html>
